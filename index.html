@media(max-width:700px){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.extraRow{grid-template-columns:1fr 78px 92px}.extraRow button{grid-column:1/4;width:100%}.shopTable{table-layout:fixed}.shopCheckCell{width:46px}.shopQtyCell{width:80px;padding-left:8px!important}.shopUnitCell{width:44px;padding-left:7px!important}.shopNameCell{padding-left:8px!important;font-size:15px}}

<section id="plan" class="panel on"><div class="card"><div class="head"><div><h2>Co chceš vařit?</h2><span class="muted">Vyber recepty a počet porcí.</span></div><button class="btn" onclick="clearPlan()">Zrušit výběr</button></div><div id="planList"></div><button class="btn primary full" onclick="openStock()">Pokračovat ke kontrole zásob →</button></div></section>

<section id="shop" class="panel"><div class="card"><h2>Nákupní lístek <span id="prog" class="muted"></span></h2><div class="progress"><span id="bar"></span></div><div class="extraBox"><div class="extraTitle">Přidat vlastní položku</div><div class="extraRow"><input id="extraName" placeholder="Např. toaletní papír"><input id="extraQty" type="number" min="0" step="0.01" value="1"><select id="extraUnit"><option>ks</option><option>g</option><option>kg</option><option>ml</option><option>l</option><option>balení</option></select><button class="btn primary" onclick="addExtra()">Přidat</button></div></div><div id="shopList"></div><button class="btn" onclick="show('stock')">← Upravit zásoby</button></div></section>
<section id="recipes" class="panel"><div class="grid"><div class="card"><h2 id="ft">Přidat recept</h2><input id="rn" placeholder="Název jídla"><br><br><input id="rs" type="number" min="1" value="4" placeholder="Porce"><div class="head"><b>Ingredience</b><button class="btn" onclick="addRow()">+ řádek</button></div><div id="rows"></div><button class="btn primary full" onclick="saveRecipe()">Uložit recept</button></div><div class="card"><h2>Uložené recepty</h2><div id="recipeList"></div></div></div></section></div>
<script>
var cats=['Zelenina a ovoce','Maso a ryby','Mléčné','Pečivo','Trvanlivé','Koření','Nápoje','Drogerie','Ostatní'],units=['g','kg','ks','ml','l','balení','lžíce','lžička','špetka'],recipes=[],plan={},req=[],have={},shop=[],edit=null;
function e(s){return String(s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function num(v){v=parseFloat(v);return isNaN(v)?0:Math.max(0,v)}function key(a,b){return a.toLowerCase().replace(/^\s+|\s+$/g,'')+'|'+b.toLowerCase().replace(/^\s+|\s+$/g,'')}function save(){try{localStorage.setItem('mealAppHTA',JSON.stringify({recipes:recipes,plan:plan,workflowStock:have,shopping:shop}))}catch(x){}}function load(){try{var d=JSON.parse(localStorage.getItem('mealAppHTA')||'null');if(d){recipes=d.recipes||[];plan=d.plan||{};have=d.workflowStock||{};shop=d.shopping||[];return}}catch(x){}recipes=[{id:1,name:'Špagety Bolognese',servings:4,ingredients:[{name:'Mleté maso',qty:500,unit:'g',category:'Maso a ryby'},{name:'Špagety',qty:500,unit:'g',category:'Trvanlivé'},{name:'Cibule',qty:1,unit:'ks',category:'Zelenina a ovoce'}]}]}
function show(x){var ps=document.getElementsByClassName('panel'),bs=document.getElementsByClassName('nav')[0].getElementsByTagName('button');for(var i=0;i<ps.length;i++)ps[i].className='panel';for(i=0;i<bs.length;i++)bs[i].className='';document.getElementById(x).className='panel on';document.getElementById('n'+x.charAt(0).toUpperCase()+x.slice(1)).className='on'}function find(id){for(var i=0;i<recipes.length;i++)if(recipes[i].id==id)return recipes[i]}function badges(){var c=0,k;for(k in plan)c++;document.getElementById('pc').innerText=c;var u=0;for(var i=0;i<shop.length;i++)if(!shop[i].done)u++;document.getElementById('sc').innerText=u}
function renderPlan(){var s='';for(var i=0;i<recipes.length;i++){var r=recipes[i],p=plan[r.id];s+='<div class="item plan '+(p?'selected':'')+'"><button class="pick '+(p?'on':'')+'" onclick="toggle('+r.id+','+(p?'false':'true')+')">'+(p?'✓ Vybráno':'Vybrat')+'</button><div><b>'+e(r.name)+'</b><div class="muted">Základ '+r.servings+' porce</div></div><input type="number" min="1" value="'+(p?p.servings:r.servings)+'" '+(p?'':'disabled')+' onchange="serv('+r.id+',this.value)"></div>'}document.getElementById('planList').innerHTML=s;badges()}function toggle(id,on){if(on)plan[id]={servings:find(id).servings};else delete plan[id];renderPlan();save()}function serv(id,v){plan[id].servings=Math.max(1,num(v));save()}function clearPlan(){plan={};have={};shop=[];renderAll();save()}
function merge(){var m={},id,r,f,i,z,k;for(id in plan){r=find(id);if(!r)continue;f=plan[id].servings/r.servings;for(i=0;i<r.ingredients.length;i++){z=r.ingredients[i];k=key(z.name,z.unit);if(!m[k])m[k]={key:k,name:z.name,qty:0,unit:z.unit,category:z.category};m[k].qty+=z.qty*f}}req=[];for(k in m){m[k].qty=Math.round(m[k].qty*100)/100;req.push(m[k])}req.sort(function(a,b){return a.category.localeCompare(b.category)||a.name.localeCompare(b.name)})}function openStock(){var k,ok=false;for(k in plan){ok=true;break}if(!ok){alert('Nejprve vyber alespoň jedno jídlo.');return}merge();renderStock();show('stock')}
function catData(c){var m={
'Maso a ryby':['🥩','cat-meat'],'Zelenina a ovoce':['🥦','cat-veg'],'Mléčné':['🥛','cat-dairy'],'Pečivo':['🥖','cat-bakery'],'Trvanlivé':['🥫','cat-pantry'],'Koření':['🌶','cat-spice'],'Nápoje':['🥤','cat-drink'],'Drogerie':['🧴','cat-care'],'Ostatní':['🛒','cat-other']};return m[c]||m.Ostatní}function count(a,c){var n=0;for(var i=0;i<a.length;i++)if(a[i].category==c)n++;return n}function cat(c,n){var q=catData(c);return '<div class="cat '+q[1]+'"><div class="cathead"><span class="emoji">'+q[0]+'</span>'+e(c)+'<span class="count">'+n+' položek</span></div>'}
function renderStock(){var s='',last='';for(var i=0;i<req.length;i++){var x=req[i];if(x.category!=last){if(last)s+='</div>';last=x.category;s+=cat(last,count(req,last))}s+='<div class="item stock"><div><b>'+e(x.name)+'</b><div class="need">Potřeba: '+x.qty+' '+e(x.unit)+'</div></div><input type="number" min="0" max="'+x.qty+'" step="0.01" value="'+num(have[x.key])+'" onchange="setHave('+i+',this.value)"><span>'+e(x.unit)+'</span></div>'}if(last)s+='</div>';document.getElementById('stockList').innerHTML=s}function setHave(i,v){have[req[i].key]=Math.min(req[i].qty,num(v));save()}function makeShop(){merge();shop=[];for(var i=0;i<req.length;i++){var x=req[i],left=Math.max(0,x.qty-num(have[x.key]));if(left>.001)shop.push({name:x.name,qty:Math.round(left*100)/100,unit:x.unit,category:x.category,done:false})}renderShop();save();show('shop')}
function renderShop(){var s='',last='';for(var i=0;i<shop.length;i++){var x=shop[i];if(x.category!=last){if(last)s+='</div>';last=x.category;s+=cat(last,count(shop,last))}s+='<div class="item shop '+(x.done?'done':'')+'"><table class="shopTable" cellspacing="0" cellpadding="0"><tr><td class="shopCheckCell"><button class="tick" onclick="check('+i+')">✓</button></td><td class="shopNameCell">'+e(x.name)+'</td><td class="shopQtyCell"><input class="shopQty" type="number" min="0" step="0.01" value="'+x.qty+'" onchange="shop['+i+'].qty=num(this.value);save()"></td><td class="shopUnitCell">'+e(x.unit)+(x.extra?' <button class="extraDelete" onclick="event.cancelBubble=true;removeExtra('+i+')" title="Odstranit položku">×</button>':'')+'</td></tr></table></div>'}if(last)s+='</div>';document.getElementById('shopList').innerHTML=s||'<div class="item">Nic nemusíš kupovat.</div>';var d=0;for(i=0;i<shop.length;i++)if(shop[i].done)d++;document.getElementById('prog').innerText=d+' / '+shop.length;document.getElementById('bar').style.width=(shop.length?100*d/shop.length:0)+'%';badges()}function removeExtra(i){shop.splice(i,1);renderShop();save()}function check(i){shop[i].done=!shop[i].done;renderShop();save()}
function opts(a,v){var s='';for(var i=0;i<a.length;i++)s+='<option'+(a[i]==v?' selected':'')+'>'+a[i]+'</option>';return s}function addRow(v){v=v||{name:'',qty:1,unit:'ks',category:'Ostatní'};var d=document.createElement('div');d.className='row';d.innerHTML='<input class="nm" placeholder="Ingredience" value="'+e(v.name)+'"><input class="qt" type="number" min="0" step="0.01" value="'+v.qty+'"><select class="un">'+opts(units,v.unit)+'</select><select class="ca catpick">'+opts(cats,v.category)+'</select><button class="btn" onclick="this.parentNode.parentNode.removeChild(this.parentNode)">×</button>';document.getElementById('rows').appendChild(d)}function saveRecipe(){var name=document.getElementById('rn').value,rows=document.getElementsByClassName('row'),a=[];for(var i=0;i<rows.length;i++){var z={name:rows[i].getElementsByClassName('nm')[0].value,qty:num(rows[i].getElementsByClassName('qt')[0].value),unit:rows[i].getElementsByClassName('un')[0].value,category:rows[i].getElementsByClassName('ca')[0].value};if(z.name&&z.qty)a.push(z)}if(!name||!a.length)return alert('Doplň název a ingredience.');recipes.push({id:new Date().getTime(),name:name,servings:Math.max(1,num(document.getElementById('rs').value)),ingredients:a});document.getElementById('rn').value='';document.getElementById('rows').innerHTML='';addRow();renderAll();save()}function renderRecipes(){var s='';for(var i=0;i<recipes.length;i++){var r=recipes[i];s+='<div class="item head recipeSaved"><div><b>'+e(r.name)+'</b><div class="muted">'+r.servings+' porce · '+r.ingredients.length+' ingrediencí</div></div><button class="btn" onclick="delR('+r.id+')">Smazat</button></div>'}document.getElementById('recipeList').innerHTML=s}function delR(id){if(!confirm('Smazat recept?'))return;var a=[];for(var i=0;i<recipes.length;i++)if(recipes[i].id!=id)a.push(recipes[i]);recipes=a;delete plan[id];renderAll();save()}function addExtra(){var name=document.getElementById('extraName').value.replace(/^\s+|\s+$/g,''),qty=num(document.getElementById('extraQty').value),unit=document.getElementById('extraUnit').value;if(!name){alert('Doplň název položky.');return}shop.push({name:name,qty:qty||1,unit:unit,category:'Ostatní',done:false,extra:true});document.getElementById('extraName').value='';document.getElementById('extraQty').value=1;renderShop();save()}function renderAll(){renderPlan();renderRecipes();renderShop()}load();addRow();renderAll();try{window.resizeTo(1180,850)}catch(x){}
